# Temporary: checks the winget fallback for NSIS on the Windows release runners. Removed before merge.
name: NSIS winget check
on:
  push:
    branches: [release-nsis-fallback]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - shell: bash
        run: |
          nsis="/c/Program Files (x86)/NSIS/makensis.exe"
          have_nsis() { command -v makensis > /dev/null || [ -x "$nsis" ]; }
          echo "before: $(have_nsis && echo present || echo absent)"
          choco uninstall nsis -y --no-progress || true
          [ -x "$nsis" ] && echo "still present after uninstall" || echo "absent now"
          winget --version
          for attempt in 1 2 3; do
            have_nsis && break
            [ "$attempt" -gt 1 ] && sleep $((attempt * 20))
            winget install --id NSIS.NSIS --exact --silent --scope machine --disable-interactivity \
              --accept-source-agreements --accept-package-agreements || true
          done
          have_nsis || { echo "::error::NSIS did not install from winget"; exit 1; }
          "$nsis" -VERSION
